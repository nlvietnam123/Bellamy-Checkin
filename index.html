<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bellamy Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: 0 auto;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
      background: #f1f1f1;
      min-height: 80px;
    }

    .success {
      background: #e8f7ed !important;
      color: #137333;
    }

    .error {
      background: #fdeaea !important;
      color: #c5221f;
    }

    .loading {
      background: #fff8e1 !important;
      color: #8a6500;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
      margin: 8px 0;
    }

    .phone {
      font-size: 18px;
    }

    .note {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔵 Bellamy Check-in</h1>

  <div class="subtitle">
    Quét mã QR để xác nhận tham dự
  </div>

  <div id="reader"></div>

  <div id="result">
    📷 Đưa mã QR vào khung để quét
  </div>

  <div class="note">
    Mỗi mã QR chỉ được Check-in một lần.
  </div>

</div>


<script>

/* =====================================================
   API CHECK-IN MỚI
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwPMSvlAgB4YrHzoEow2gLsq259kyMMz-Gho41pwEw-8Ocq5pcYdwA5TI726ODHrudw-Q/exec";


/* =====================================================
   BIẾN HỆ THỐNG
   ===================================================== */

let isChecking = false;


/* =====================================================
   HIỂN THỊ KẾT QUẢ
   ===================================================== */

function showResult(result) {

  const box = document.getElementById("result");

  if (result.success) {

    box.className = "success";

    box.innerHTML =
      "🟢 <strong>CHECK-IN THÀNH CÔNG</strong>" +
      "<div class='name'>" +
      "👤 " + escapeHTML(result.name) +
      "</div>" +
      "<div class='phone'>" +
      "📱 " + escapeHTML(result.phone) +
      "</div>";

  } else {

    box.className = "error";

    box.innerHTML =
      result.message || "❌ Có lỗi xảy ra";
  }
}


/* =====================================================
   CHỐNG HTML INJECTION
   ===================================================== */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   GỌI API CHECK-IN
   ===================================================== */

function checkQR(decodedText) {

  if (isChecking) {
    return;
  }

  isChecking = true;

  const box = document.getElementById("result");

  box.className = "loading";

  box.innerHTML =
    "⏳ <strong>Đang kiểm tra QR...</strong>";


  /* Tạo tên callback ngẫu nhiên */

  const callbackName =
    "qrCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  let finished = false;


  /* Callback nhận kết quả từ Apps Script */

  window[callbackName] = function(result) {

    if (finished) {
      return;
    }

    finished = true;

    clearTimeout(timeout);

    showResult(result);

    cleanup();
  };


  /* Dọn callback và script */

  function cleanup() {

    delete window[callbackName];

    if (script && script.parentNode) {
      script.parentNode.removeChild(script);
    }

    setTimeout(function() {
      isChecking = false;
    }, 1500);
  }


  /* Tạo URL API */

  const url =
    API_URL +
    "?token=" +
    encodeURIComponent(decodedText.trim()) +
    "&callback=" +
    callbackName;


  /* Tạo script JSONP */

  const script = document.createElement("script");

  script.src = url;

  script.async = true;


  /* Nếu API lỗi */

  script.onerror = function() {

    if (finished) {
      return;
    }

    finished = true;

    clearTimeout(timeout);

    box.className = "error";

    box.innerHTML =
      "❌ Không kết nối được hệ thống Check-in.";

    cleanup();
  };


  document.head.appendChild(script);


  /* Timeout 10 giây */

  const timeout = setTimeout(function() {

    if (finished) {
      return;
    }

    finished = true;

    box.className = "error";

    box.innerHTML =
      "❌ Hệ thống phản hồi quá lâu.<br>" +
      "Vui lòng thử quét lại.";

    cleanup();

  }, 10000);

}


/* =====================================================
   KHỞI TẠO CAMERA QR
   ===================================================== */

function onScanSuccess(decodedText) {

  checkQR(decodedText);

}


/* =====================================================
   KHỞI ĐỘNG SCANNER
   ===================================================== */

const scanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },

    false
  );


scanner.render(onScanSuccess);

</script>

</body>
</html>
